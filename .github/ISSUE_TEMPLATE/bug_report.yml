name: Bug Report
description: File a bug report to help us improve Antigravity Motion Studio
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please ensure you have checked existing issues before filing.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or commands to reproduce the behavior.
      placeholder: |
        1. Run 'node render.mjs --fps 30'
        2. Inspect output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Node.js version, Python version, FFmpeg version.
      placeholder: Windows 11, Node v20.10.0, Python 3.11, FFmpeg 6.0
    validations:
      required: true
